
# Render Blueprint for CareerCraft backend
services:
  - type: web
    name: careercraft-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JPA_DDL_AUTO
        value: update
      - key: REMOTE_IP_HEADER
        value: cf-connecting-ip
      - key: GROK_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-4.7
      - key: AI_DAILY_LIMIT
        value: "20"
      - key: AI_PORTFOLIO_DAILY_LIMIT
        value: "10"
